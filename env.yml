name: topofinger
# Minimal environment, derived from imports in topofinger/, scripts/ and notebooks/.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4
  - scipy=1.17
  - pandas=3.0
  - scikit-learn=1.8
  - statsmodels=0.14
  - pingouin=0.6
  - matplotlib-base=3.11
  - seaborn=0.13
  - nibabel
  - nilearn=0.14
  - pycirclize=1.10
  - svgutils=0.3
  - tqdm
  - ipykernel
  - pip
  - pip:
      - brainspace==0.2.1   # surface plots (Fig 1/4)
      - neuromaps==0.0.7    # fsLR surfaces (Fig 1/4)
      - hoi==0.0.7          # synergy/redundancy (PhiID) in scripts 08-09
      - statannotations==0.7.2

# Julia (>= 1.9; scaffolds are computed with Julia, not Python). Install in the Julia REPL:
#   using Pkg; Pkg.add(["Ripserer", "NPZ", "MAT", "Pickle", "ProgressMeter", "DelimitedFiles", "Statistics"])
# Used by scripts/01_*.jl, 02_*.jl, 03_*.jl and notebooks/01*_julia.ipynb.
